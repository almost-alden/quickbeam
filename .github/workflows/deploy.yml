name: Deploy to Firebase

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud via Workload Identity
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/470817308605/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider
          service_account: couchbeam-github-deploy@quickbeam-prod.iam.gserviceaccount.com

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: relay/package-lock.json

      - name: Install dependencies & run tests
        run: |
          cd relay
          npm ci
          npm test

      - name: Deploy Firebase Hosting & Rules
        run: |
          npx -y firebase-tools@latest deploy --only hosting,firestore:rules --project quickbeam-prod
